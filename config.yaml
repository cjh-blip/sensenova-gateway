model_list:
  # Multi-key load balancing: same model_name, multiple deployments.
  # On 429, LiteLLM cools the failed key and retries the next one.
  # Add a key: copy one block, change the env var name (e.g. SENSENOVA_KEY4),
  # and make sure the env var exists in the user environment.
  - model_name: deepseek-v4-flash
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: https://token.sensenova.cn/v1
      api_key: os.environ/SENSENOVA_KEY1
  - model_name: deepseek-v4-flash
    litellm_params:
      model: openai/deepseek-v4-flash
