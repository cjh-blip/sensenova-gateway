router_settings:
  num_retries: 8          # max retries per request before giving up
  timeout: 300            # max seconds per request (5 min: slow-but-stable)
  cooldown_time: 60       # seconds a key cools down after a 429
  retry_after: 60         # seconds to wait before retrying after a 429
  default_max_parallel_requests: 3  # per-key concurrent requests (multi-key = multi-channel)
